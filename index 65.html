<title>Sol — Assistente financeiro</title>
<style>:root{color-scheme:dark;--bg:#111112;--card:#1b1b1d;--card2:#242427;--ink:#f3f3f0;--ink2:#c8c8cc;--mute:#8e8e95;--line:#2a2a2d;--soft:#232326;--soft2:#303034;--pos:#8fe3c0;--posbg:rgba(143,227,192,.13);--neg:#f19a92;--negbg:rgba(241,154,146,.13);--warn:#f0cf7a;--warnbg:rgba(240,207,122,.13);--dk:#17171a;--r:24px;--tab:64px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--grad:radial-gradient(120% 100% at 88% 0%,#ebe99c 0%,rgba(235,233,156,0) 58%),radial-gradient(90% 110% at 0% 10%,#c4d4bf 0%,rgba(196,212,191,0) 62%),linear-gradient(165deg,#d3d4ee 0%,#c9cdea 100%);--gfill:linear-gradient(90deg,#ece99d,#cfcdf6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ic{flex:none;display:block}
.app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
.page{padding:calc(var(--sat) + 14px) 18px calc(var(--tab) + var(--sab) + 28px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;min-height:40px}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.03em}
.top .hello small{display:block;color:var(--mute);font-size:13px;margin-bottom:1px}
.top .hello b{font-size:22px;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--soft2)}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--soft);border-radius:999px;padding:3px;font-size:13px;font-weight:600}
.monthnav button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.monthnav span{padding:0 6px;text-transform:capitalize;min-width:104px;text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.035)}
.card h2{font-size:15px;font-weight:650;letter-spacing:-.01em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h2 a,.link{font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none;display:inline-flex;align-items:center;gap:2px;cursor:pointer}
.hero{background:var(--ink);color:#fff;border-radius:26px;padding:22px 20px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.hero small{color:rgba(255,255,255,.62);font-size:13px;font-weight:500}
.hero .big{font-size:38px;font-weight:650;letter-spacing:-.035em;margin:4px 0 14px;line-height:1.1}
.hero .subs{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff}
.pill.light{background:var(--soft);color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid2 .card{margin:0}
.kpi small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;font-weight:500}
.kpi .v{font-size:21px;font-weight:650;letter-spacing:-.025em;margin-top:6px}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.dot.pos{background:var(--posbg);color:var(--pos)}.dot.neg{background:var(--negbg);color:var(--neg)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.chip.pos{background:var(--posbg);color:var(--pos)}.chip.neg{background:var(--negbg);color:var(--neg)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.res{display:flex;justify-content:space-between;align-items:center}
.res .v{font-size:24px;font-weight:650;letter-spacing:-.03em}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10.5px;fill:var(--mute);font-family:inherit}
.chart .sel text{fill:var(--ink);font-weight:700}
.caption{font-size:13px;color:var(--ink2);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.caption>b:first-child{text-transform:none}
details.tbl{margin-top:10px;font-size:12px}details.tbl summary{color:var(--mute);cursor:pointer}

<body>
<div id="root"></div>
<noscript>Ative o JavaScript para usar o Sol.</noscript>
<script>(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SolEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
'use strict';

/* ============ Utilidades ============ */
const MAX_CENTS = 99999999999;
const norm = s => String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Rand = { fn: Math.random };
const pick = a => a[Math.floor(Rand.fn() * a.length) % a.length];
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MONTHS_N = MONTHS.map(norm);

/* ============ Datas ============ */
const Clock = { now: () => new Date() };
const D = {
  iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
  today() { return D.iso(Clock.now()); },
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
  valid(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const y = +s.slice(0, 4); if (y < 1990 || y > 2200) return false;
    return D.iso(D.parse(s)) === s;
  },
  dim(y, m) { return new Date(y, m, 0).getDate(); },
  addMonths(s, n) {
    const [y, m, d] = s.split('-').map(Number); const t = y * 12 + (m - 1) + n;
    const ny = Math.floor(t / 12), nm = t % 12 + 1;
    return ny + '-' + pad(nm) + '-' + pad(Math.min(d, D.dim(ny, nm)));
  },
  addDays(s, n) { const d = D.parse(s); d.setDate(d.getDate() + n); return D.iso(d); },
  diffDays(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 86400000); },
  ymAdd(ym, n) { return D.addMonths(ym + '-01', n).slice(0, 7); },
  monthRange(ym) { const [y, m] = ym.split('-').map(Number); return [ym + '-01', ym + '-' + pad(D.dim(y, m))]; },
  withDay(ym, day) { const [y, m] = ym.split('-').map(Number); return ym + '-' + pad(Math.min(Math.max(1, day), D.dim(y, m))); },
  br(s) { return s.slice(8, 10) + '/' + s.slice(5, 7); },
  brFull(s) { return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4); },
  monthName(ym) { return MONTHS[+ym.slice(5, 7) - 1]; },
  monthLabel(ym) { return D.monthName(ym) + ' de ' + ym.slice(0, 4); },
  monthShort(ym) { return D.monthName(ym).slice(0, 3); },
  monday(s) { const d = D.parse(s); const wd = (d.getDay() + 6) % 7; return D.addDays(s, -wd); },
  nextOccurrence(today, day) { // próxima data com dia `day` (hoje conta)
    let c = D.withDay(today.slice(0, 7), day);
    if (c < today) c = D.withDay(D.ymAdd(today.slice(0, 7), 1), day);
    return c;
  }
};

/* ============ Dinheiro (centavos inteiros) ============ */
function parseNumber(s) {
  s = String(s).trim();
  if (!/^\d[\d.,]*$/.test(s)) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s); return isFinite(n) ? n : NaN;
}
const toCents = n => Math.round((n + 1e-9) * 100);
const Money = {
  fmt(c) {
    c = Math.round(c || 0); const neg = c < 0, a = Math.abs(c);
    return (neg ? '-' : '') + 'R$ ' + String(Math.floor(a / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + pad(a % 100);
  },
  fmtShort(c) { // para gráficos
    const a = Math.abs(c) / 100;
    if (a >= 1e6) return (a / 1e6).toFixed(1).replace('.', ',') + ' mi';
    if (a >= 1e4) return Math.round(a / 1e3) + ' mil';
    if (a >= 1e3) return (a / 1e3).toFixed(1).replace('.', ',') + ' mil';
    return String(Math.round(a));
  },
  parse(str) { // entrada de formulário -> centavos | null
    let s = norm(str).replace(/r\$|reais|real/g, '').replace(/\s+/g, ' ').trim();
    let mult = 1; const m = s.match(/^(.*?)\s*(mil|k)$/); if (m) { s = m[1].trim(); mult = 1000; }
    const n = parseNumber(s); if (!isFinite(n)) return null;
    const c = toCents(n * mult); return c > 0 && c <= MAX_CENTS ? c : null;
  },
  toInput(c) { return (c / 100).toFixed(2).replace('.', ','); }
};

/* ============ Dados padrão ============ */
const DEFAULT_CATS = [
  { id: 'alimentacao', name: 'Alimentação', type: 'despesa', icon: 'food', kw: ['mercado', 'supermercado', 'hortifruti', 'feira', 'padaria', 'restaurante', 'lanche', 'lanchonete', 'almoco', 'jantar', 'cafe', 'cafeteria', 'pizza', 'pizzaria', 'hamburguer', 'burger', 'ifood', 'rappi', 'acougue', 'sorvete', 'acai', 'churrasco', 'sushi', 'comida', 'marmita', 'delivery', 'refeicao', 'salgado', 'doce'] },
  { id: 'transporte', name: 'Transporte', type: 'despesa', icon: 'car', kw: ['uber', 'taxi', 'onibus', 'metro', 'trem', 'passagem', 'estacionamento', 'pedagio', 'bilhete', 'cabify', 'mecanico', 'oficina', 'revisao', 'ipva', 'lavagem'] },
  { id: 'combustivel', name: 'Combustível', type: 'despesa', icon: 'fuel', kw: ['combustivel', 'gasolina', 'etanol', 'alcool', 'diesel', 'posto', 'abasteci', 'abastecimento', 'gnv'] },
  { id: 'moradia', name: 'Moradia', type: 'despesa', icon: 'home', kw: ['aluguel', 'condominio', 'iptu', 'reforma', 'moveis', 'movel', 'financiamento', 'faxina', 'diarista', 'manutencao', 'casa'] },
  { id: 'contas', name: 'Contas e serviços', type: 'despesa', icon: 'zap', kw: ['luz', 'energia', 'agua', 'gas', 'internet', 'net', 'telefone', 'esgoto', 'tv', 'vivo', 'claro'] },
  { id: 'saude', name: 'Saúde', type: 'despesa', icon: 'heart', kw: ['farmacia', 'remedio', 'medico', 'consulta', 'dentista', 'exame', 'hospital', 'plano de saude', 'psicologo', 'terapia', 'drogaria', 'academia'] },
  { id: 'educacao', name: 'Educação', type: 'despesa', icon: 'book', kw: ['curso', 'escola', 'faculdade', 'livro', 'mensalidade', 'matricula', 'material escolar', 'aula', 'idioma', 'ingles', 'universidade'] },
  { id: 'lazer', name: 'Lazer', type: 'despesa', icon: 'smile', kw: ['cinema', 'show', 'viagem', 'bar', 'balada', 'jogo', 'parque', 'passeio', 'festa', 'teatro', 'hotel', 'hospedagem', 'ingresso', 'festival', 'boliche'] },
  { id: 'assinaturas', name: 'Assinaturas', type: 'despesa', icon: 'repeat', kw: ['netflix', 'spotify', 'assinatura', 'disney', 'hbo', 'prime', 'youtube', 'icloud', 'streaming', 'deezer', 'globoplay', 'max'] },
  { id: 'compras', name: 'Compras', type: 'despesa', icon: 'bag', kw: ['roupa', 'sapato', 'tenis', 'loja', 'shopping', 'eletronico', 'presente', 'amazon', 'shopee', 'mercado livre', 'aliexpress', 'magalu', 'americanas', 'camiseta', 'calca', 'perfume', 'cosmetico', 'maquiagem', 'celular'] },
  { id: 'pets', name: 'Pets', type: 'despesa', icon: 'paw', kw: ['pet', 'petshop', 'racao', 'veterinario', 'cachorro', 'gato', 'tosa'] },
  { id: 'beleza', name: 'Beleza', type: 'despesa', icon: 'scissors', kw: ['barbeiro', 'barbearia', 'salao', 'cabelo', 'cabeleireiro', 'manicure', 'estetica', 'unha', 'depilacao'] },
  { id: 'outros_d', name: 'Outros', type: 'despesa', icon: 'dots', kw: [], generic: true },
  { id: 'salario', name: 'Salário', type: 'receita', icon: 'coins', kw: ['salario', 'holerite', 'contracheque', 'decimo terceiro', '13o', 'ferias'] },
  { id: 'freelance', name: 'Freelance', type: 'receita', icon: 'briefcase', kw: ['freela', 'freelance', 'freelancer', 'servico', 'projeto', 'cliente', 'consultoria', 'bico', 'comissao'] },
  { id: 'investimentos', name: 'Investimentos', type: 'receita', icon: 'trend', kw: ['rendimento', 'dividendo', 'dividendos', 'juros', 'investimento', 'cdb', 'tesouro', 'acoes', 'fii', 'lucro'] },
  { id: 'vendas', name: 'Vendas', type: 'receita', icon: 'tag', kw: ['venda', 'vendas', 'vendi'] },
  { id: 'presentes', name: 'Presentes', type: 'receita', icon: 'gift', kw: ['mesada', 'doacao', 'ganhei de presente'] },
  { id: 'outros_r', name: 'Outras receitas', type: 'receita', icon: 'dots', kw: ['reembolso', 'estorno', 'cashback'], generic: true }
];

function newDb() {
  return {
    schema: 1, createdAt: D.today(),
    accounts: [
      { id: 'acc_main', name: 'Conta principal', type: 'conta', opening: 0 },
      { id: 'acc_wallet', name: 'Carteira', type: 'carteira', opening: 0 }
    ],
    categories: JSON.parse(JSON.stringify(DEFAULT_CATS)),
    tx: [], recurrences: [], goals: [], budgets: {},
    chat: { messages: [], pending: null, last: null },
    usage: { messages: 0, aiTokens: 0 }, settings: {}
  };
}

/* ============ Validação / Operações ============ */
const fail = m => { throw new Error(m); };
const cleanStr = (s, max) => String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);
const findCat = (db, id) => db.categories.find(c => c.id === id);
const findAcc = (db, id) => db.accounts.find(a => a.id === id);
const isCard = a => a && a.type === 'cartao';

const Ops = {
  checkAmount(c) { if (!Number.isInteger(c) || c <= 0 || c > MAX_CENTS) fail('Informe um valor maior que zero.'); },
  addTx(db, p) {
    const type = p.type;
    if (!['receita', 'despesa', 'transferencia'].includes(type)) fail('Tipo de lançamento inválido.');
    Ops.checkAmount(p.amount);
    if (!D.valid(p.date)) fail('Data inválida.');
    if (!findAcc(db, p.acc)) fail('Escolha uma conta.');
    if (type === 'transferencia') {
      if (!findAcc(db, p.toAcc)) fail('Escolha a conta de destino.');
      if (p.toAcc === p.acc) fail('Origem e destino devem ser diferentes.');
    }
    const cat = type === 'transferencia' ? null : (findCat(db, p.cat) && findCat(db, p.cat).type === type ? p.cat : null);
    const desc = cleanStr(p.desc, 120) || (type === 'transferencia' ? 'Transferência' : (cat ? findCat(db, cat).name : cap(type)));
    const status = p.status === 'pendente' ? 'pendente' : 'pago';
    if (status === 'pendente' && type === 'transferencia') fail('Transferências não podem ficar pendentes.');
    const t = { id: uid(), type, amount: p.amount, date: p.date, desc, cat, acc: p.acc, toAcc: type === 'transferencia' ? p.toAcc : null, status, source: p.source || 'app' };
    if (p.recId) { t.recId = p.recId; t.recYm = p.recYm || p.date.slice(0, 7); }
    if (p.group) { t.group = p.group; t.inst = p.inst; }
    if (p.ext) t.ext = String(p.ext).slice(0, 60);
    if (p.batch) t.batch = String(p.batch).slice(0, 30);
    db.tx.push(t); return t;
  },
  // compra parcelada: `total` é o valor total; devolve a lista de parcelas
  addInstallments(db, p, n) {
    n = parseInt(n, 10); if (!(n >= 2 && n <= 48)) fail('Parcelas devem ser entre 2 e 48.');
    Ops.checkAmount(p.total);
    const base = Math.floor(p.total / n), rest = p.total - base * n, group = uid(), out = [];
    for (let i = 0; i < n; i++) {
      out.push(Ops.addTx(db, Object.assign({}, p, {
        type: 'despesa', amount: base + (i === 0 ? rest : 0), date: D.addMonths(p.date, i),
        desc: cleanStr(p.desc, 100) + ' (' + (i + 1) + '/' + n + ')', status: 'pago', group, inst: [i + 1, n]
      })));
    }
    return out;
  },
  updateTx(db, id, p) {
    const t = db.tx.find(x => x.id === id); if (!t) fail('Lançamento não encontrado.');
    const tmp = { tx: [] , accounts: db.accounts, categories: db.categories };
    const n = Ops.addTx(tmp, Object.assign({}, t, p));
    Object.assign(t, { type: n.type, amount: n.amount, date: n.date, desc: n.desc, cat: n.cat, acc: n.acc, toAcc: n.toAcc, status: n.status });
    return t;
  },
  deleteTx(db, id) {
    const i = db.tx.findIndex(x => x.id === id); if (i < 0) return false;
    const t = db.tx[i];
    if (t.recId) { const r = db.recurrences.find(x => x.id === t.recId); if (r) (r.skip = r.skip || []).push(t.recYm); }
    db.tx.splice(i, 1); return true;
  },
  markPaid(db, id, today) {
    const t = db.tx.find(x => x.id === id); if (!t) fail('Lançamento não encontrado.');
    t.status = 'pago'; t.date = today; return t;
  },
  saveAccount(db, p) {
    const name = cleanStr(p.name, 40); if (!name) fail('Dê um nome para a conta.');
    if (!['conta', 'carteira', 'cartao'].includes(p.type)) fail('Tipo de conta inválido.');
    const opening = Number.isInteger(p.opening) ? p.opening : 0;
    if (Math.abs(opening) > MAX_CENTS) fail('Valor muito alto.');
    const o = { name, type: p.type, opening };
    if (p.type === 'cartao') {
      o.limit = Number.isInteger(p.limit) && p.limit >= 0 ? p.limit : 0;
      o.closingDay = Math.min(31, Math.max(1, parseInt(p.closingDay, 10) || 1));
      o.dueDay = Math.min(31, Math.max(1, parseInt(p.dueDay, 10) || 10));
    }
    if (p.id) { const a = findAcc(db, p.id); if (!a) fail('Conta não encontrada.'); Object.assign(a, o); return a; }
    const a = Object.assign({ id: uid() }, o); db.accounts.push(a); return a;
  },
  deleteAccount(db, id) {
    if (db.tx.some(t => t.acc === id || t.toAcc === id)) fail('Esta conta tem lançamentos. Exclua ou mova os lançamentos antes.');
    if (db.accounts.filter(a => !isCard(a)).length <= 1 && !isCard(findAcc(db, id))) fail('Mantenha pelo menos uma conta ou carteira.');
    db.recurrences = db.recurrences.filter(r => r.acc !== id);
    db.goals.forEach(g => { if (g.acc === id) g.acc = null; });
    db.accounts = db.accounts.filter(a => a.id !== id);
  },
  saveCategory(db, p) {
    const name = cleanStr(p.name, 30); if (!name) fail('Dê um nome para a categoria.');
    if (!['despesa', 'receita'].includes(p.type)) fail('Tipo inválido.');
    if (db.categories.some(c => c.id !== p.id && c.type === p.type && norm(c.name) === norm(name))) fail('Já existe uma categoria com esse nome.');
    const kw = String(p.kw || '').split(',').map(s => norm(cleanStr(s, 30))).filter(Boolean).slice(0, 20);
    if (p.id) { const c = findCat(db, p.id); if (!c) fail('Categoria não encontrada.'); Object.assign(c, { name, icon: p.icon || c.icon, kw }); return c; }
    const c = { id: 'c_' + uid(), name, type: p.type, icon: p.icon || 'tag', kw }; db.categories.push(c); return c;
  },
  deleteCategory(db, id) {
    const c = findCat(db, id); if (!c) return;
    if (c.generic) fail('Esta categoria padrão não pode ser removida.');
    const fb = db.categories.find(x => x.type === c.type && x.generic);
    db.tx.forEach(t => { if (t.cat === id) t.cat = fb ? fb.id : null; });
    db.recurrences.forEach(r => { if (r.cat === id) r.cat = fb ? fb.id : null; });
    delete db.budgets[id]; db.categories = db.categories.filter(x => x.id !== id);
  },
  setBudget(db, catId, cents) {
    const c = findCat(db, catId); if (!c || c.type !== 'despesa') fail('Categoria inválida.');
    if (!cents) { delete db.budgets[catId]; return; }
    Ops.checkAmount(cents); db.budgets[catId] = cents;
  },
  addGoal(db, p) {
    const name = cleanStr(p.name, 40); if (!name) fail('Dê um nome para a meta.');
    Ops.checkAmount(p.target);
    if (p.deadline && !D.valid(p.deadline)) fail('Prazo inválido.');
    const g = { id: uid(), name, target: p.target, deadline: p.deadline || null, created: p.today || D.today(), history: [], acc: Ops.goalAcc(db, p.acc) };
    if (p.initial > 0) g.history.push({ id: uid(), date: g.created, amount: p.initial });
    db.goals.push(g); return g;
  },
  goalAcc(db, id) { const a = id ? findAcc(db, id) : null; return a && !isCard(a) ? a.id : null; },
  updateGoal(db, id, p) {
    const g = db.goals.find(x => x.id === id); if (!g) fail('Meta não encontrada.');
    const name = cleanStr(p.name, 40); if (!name) fail('Dê um nome para a meta.');
    Ops.checkAmount(p.target);
    if (p.deadline && !D.valid(p.deadline)) fail('Prazo inválido.');
    Object.assign(g, { name, target: p.target, deadline: p.deadline || null, acc: Ops.goalAcc(db, p.acc) }); return g;
  },
  contribute(db, id, amount, date) {
    const g = db.goals.find(x => x.id === id); if (!g) fail('Meta não encontrada.');
    if (!Number.isInteger(amount) || amount === 0 || Math.abs(amount) > MAX_CENTS) fail('Informe um valor válido.');
    if (!D.valid(date)) fail('Data inválida.');
    if (amount < 0 && F.saved(g) + amount < 0) fail('Você não pode retirar mais do que guardou.');
    if (amount > 0 && g.acc && findAcc(db, g.acc)) { const free = F.free(db, g.acc, D.today()); if (amount > free) fail('Saldo livre insuficiente em ' + findAcc(db, g.acc).name + ' (livre: ' + Money.fmt(Math.max(0, free)) + ').'); }
    g.history.push({ id: uid(), date, amount }); return g;
  },
  deleteGoal(db, id) { db.goals = db.goals.filter(g => g.id !== id); },
  saveRecurrence(db, p, today) {

    const desc = cleanStr(p.desc, 80); if (!desc) fail('Informe uma descrição.');
    const o = { type: p.type, desc, amount: p.amount, cat: p.cat || null, acc: p.acc, day, mode: p.mode === 'auto' ? 'auto' : 'fixa', active: true, skip: [] };
    if (p.id) { const r = db.recurrences.find(x => x.id === p.id); if (!r) fail('Item não encontrado.'); Object.assign(r, o, { skip: r.skip, active: r.active }); return r; }
    const r = Object.assign({ id: uid(), start: p.start || today.slice(0, 7) }, o); db.recurrences.push(r); return r;

/* ============ Finanças (cálculos puros) ============ */
const F = {
  balance(db, accId, today, all) {
    const a = findAcc(db, accId); if (!a) return 0; let b = a.opening || 0;
    for (const t of db.tx) {
      if (t.status === 'pendente') continue; if (!all && t.date > today) continue;
      if (t.type === 'receita' && t.acc === accId) b += t.amount;
      else if (t.type === 'despesa' && t.acc === accId) b -= t.amount;
      else if (t.type === 'transferencia') { if (t.acc === accId) b -= t.amount; if (t.toAcc === accId) b += t.amount; }
    }
    return b;
  },
  reserved(db, accId) { return db.goals.filter(g => g.acc === accId).reduce((s, g) => s + Math.max(0, F.saved(g)), 0); },
  free(db, accId, today) { return F.balance(db, accId, today) - F.reserved(db, accId); },
  totalReserved(db) { return db.goals.filter(g => g.acc && findAcc(db, g.acc)).reduce((s, g) => s + Math.max(0, F.saved(g)), 0); },
  totalAvailable(db, today) { return db.accounts.filter(a => !isCard(a)).reduce((s, a) => s + F.balance(db, a.id, today), 0); },
  cardInfo(db, id, today) {
    const a = findAcc(db, id);
    const used = Math.max(0, -F.balance(db, id, today, true)), fatura = Math.max(0, -F.balance(db, id, today, false));
    const limit = a.limit || 0; return { used, fatura, limit, available: Math.max(0, limit - used) };
  },
  totalCardDebt(db, today) { return db.accounts.filter(isCard).reduce((s, a) => s + F.cardInfo(db, a.id, today).fatura, 0); },
  sum(db, o) {
    let s = 0, n = 0;
    for (const t of db.tx) {
      if (t.status === 'pendente' || t.type !== o.type) continue;
      if (o.from && t.date < o.from) continue; if (o.to && t.date > o.to) continue;
      if (o.cat && t.cat !== o.cat) continue; if (o.acc && t.acc !== o.acc) continue;
      s += t.amount; n++;
    }
    return { total: s, count: n };
  },
  monthStats(db, ym) {
    const [from, to] = D.monthRange(ym);
    const r = F.sum(db, { type: 'receita', from, to }).total, d = F.sum(db, { type: 'despesa', from, to }).total;
    return { receitas: r, despesas: d, resultado: r - d };
  },
  byCategory(db, from, to, type) {
    type = type || 'despesa'; const m = new Map(); let total = 0;
    for (const t of db.tx) {
      if (t.status === 'pendente' || t.type !== type || t.date < from || t.date > to) continue;
      m.set(t.cat || '_', (m.get(t.cat || '_') || 0) + t.amount); total += t.amount;
    }
    return [...m.entries()].map(([id, v]) => {
      const c = findCat(db, id); return { id, name: c ? c.name : 'Sem categoria', icon: c ? c.icon : 'tag', total: v, pct: total ? v / total * 100 : 0 };
    }).sort((a, b) => b.total - a.total);
  },
  series(db, endYm, n) {
    const out = []; for (let i = n - 1; i >= 0; i--) { const ym = D.ymAdd(endYm, -i); out.push(Object.assign({ ym }, F.monthStats(db, ym))); } return out;
  },
  delta(cur, prev) { return prev === 0 ? null : (cur - prev) / Math.abs(prev) * 100; },
  compare(db, ym) {
    const c = F.monthStats(db, ym), p = F.monthStats(db, D.ymAdd(ym, -1));
    return { cur: c, prev: p, receitas: F.delta(c.receitas, p.receitas), despesas: F.delta(c.despesas, p.despesas), resultado: F.delta(c.resultado, p.resultado) };
  },
  forecast(db, today) {
    const ym = today.slice(0, 7), end = D.monthRange(ym)[1], daysLeft = D.diffDays(today, end);
    const isAcc = id => { const a = findAcc(db, id); return a && !isCard(a); };
    const balance = F.totalAvailable(db, today); let inc = 0, exp = 0; const items = [];
    for (const t of db.tx) {
      if (t.type === 'transferencia' || t.date > end || !isAcc(t.acc)) continue;
      const pend = t.status === 'pendente', fut = t.status !== 'pendente' && t.date > today;
      if (!pend && !fut) continue;
      if (t.type === 'receita') inc += t.amount; else exp += t.amount; items.push(t);
    }
    let cards = 0; const cardList = [];
    for (const a of db.accounts.filter(isCard)) { const f = F.cardInfo(db, a.id, today).fatura; if (f > 0 && (a.dueDay || 10) >= +today.slice(8, 10)) { cards += f; cardList.push({ name: a.name, amount: f, day: a.dueDay || 10 }); } }
    const from = D.addDays(today, -60), vt = db.tx.filter(t => t.type === 'despesa' && t.status === 'pago' && t.date >= from && t.date <= today && t.source !== 'recorrente' && !t.recId && isAcc(t.acc));
    const first = vt.reduce((m, t) => t.date < m ? t.date : m, today), span = Math.max(14, Math.min(60, D.diffDays(first, today) + 1));
    const variable = vt.length >= 3 ? Math.round(vt.reduce((a, t) => a + t.amount, 0) / span * daysLeft) : 0;
    const projected = balance + inc - exp - cards - variable;
    return { balance, income: inc, expenses: exp, cards, cardList, variable, projected, daysLeft, end, count: items.length };
  },
  alerts(db, today) {
    const out = [], m = Money.fmt, dm = d => d.slice(8) + '/' + d.slice(5, 7), ym = today.slice(0, 7);
    const pend = db.tx.filter(t => t.status === 'pendente' && t.type === 'despesa').sort((a, b) => a.date.localeCompare(b.date));
    const late = pend.filter(t => t.date < today);
    if (late.length === 1) out.push({ level: 'neg', icon: 'calendar', text: '“' + late[0].desc + '” (' + m(late[0].amount) + ') venceu em ' + dm(late[0].date) + '.', page: 'tx' });
    else if (late.length > 1) out.push({ level: 'neg', icon: 'calendar', text: late.length + ' contas vencidas somando ' + m(late.reduce((a, t) => a + t.amount, 0)) + '.', page: 'recur' });
    pend.filter(t => t.date >= today && D.diffDays(today, t.date) <= 3).slice(0, 3).forEach(t => { const n = D.diffDays(today, t.date); out.push({ level: 'warn', icon: 'calendar', text: '“' + t.desc + '” (' + m(t.amount) + ') vence ' + (n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + n + ' dias') + '.', page: 'recur' }); });
    db.accounts.filter(isCard).forEach(a => { const f = F.cardInfo(db, a.id, today).fatura, n = (a.dueDay || 10) - +today.slice(8, 10); if (f > 0 && n >= 0 && n <= 5) out.push({ level: 'warn', icon: 'card', text: 'Fatura do ' + a.name + ' (' + m(f) + ') vence ' + (n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + n + ' dias') + '.', page: 'cards' }); });
    F.budgetStatus(db, ym).filter(b => b.state !== 'ok').forEach(b => out.push({ level: b.state === 'over' ? 'neg' : 'warn', icon: b.icon || 'tag', text: b.state === 'over' ? 'Orçamento de ' + b.name + ' estourou: ' + m(b.spent) + ' de ' + m(b.limit) + '.' : 'Orçamento de ' + b.name + ' em ' + Math.round(b.pct) + '% (' + m(b.spent) + ' de ' + m(b.limit) + ').', page: 'goals' }));
    if (db.tx.length) { const f = F.forecast(db, today); if (f.projected < 0) out.push({ level: 'neg', icon: 'down', text: 'Previsão de saldo negativo no fim do mês: ' + m(f.projected) + '.', page: 'home' }); }
    return out.sort((a, b) => (a.level === 'neg' ? 0 : 1) - (b.level === 'neg' ? 0 : 1));
  },
  upcoming(db, today, days) {
    const lim = D.addDays(today, days == null ? 15 : days);
    return db.tx.filter(t => t.status === 'pendente' && t.type === 'despesa' && t.date <= lim)
      .sort((a, b) => a.date.localeCompare(b.date)).map(t => Object.assign({}, t, { overdue: t.date < today, daysLeft: D.diffDays(today, t.date) }));
  },
  saved(g) { return g.history.reduce((s, h) => s + h.amount, 0); },
  goalInfo(g, today) {
    const saved = F.saved(g), falta = Math.max(0, g.target - saved);
    const pct = Math.min(100, Math.round(saved / g.target * 1000) / 10);
    const info = { saved, falta, pct, done: falta === 0, months: null, perMonth: null, overdue: false };
    if (g.deadline && !info.done) {
      if (g.deadline < today) info.overdue = true;
      else { info.months = Math.max(1, Math.ceil(D.diffDays(today, g.deadline) / 30.4375)); info.perMonth = Math.ceil(falta / info.months); }
    }
    return info;
  },
  budgetStatus(db, ym) {
    const [from, to] = D.monthRange(ym); const cats = F.byCategory(db, from, to, 'despesa'); const out = [];
    for (const c of db.categories) {
      if (c.type !== 'despesa') continue; const limit = db.budgets[c.id]; if (!limit) continue;
      const row = cats.find(x => x.id === c.id); const spent = row ? row.total : 0;
      const pct = spent / limit * 100; out.push({ id: c.id, name: c.name, icon: c.icon, limit, spent, pct, remaining: limit - spent, state: pct > 100 ? 'over' : pct >= 80 ? 'warn' : 'ok' });
    }
    return out;
  },
  topExpenses(db, from, to, n) {
    return db.tx.filter(t => t.type === 'despesa' && t.status !== 'pendente' && t.date >= from && t.date <= to).sort((a, b) => b.amount - a.amount).slice(0, n || 5);
  },
  ensureRecurrences(db, today) {
    let created = 0; const cur = today.slice(0, 7);
    for (const r of db.recurrences) {
      if (!r.active) continue; const limit = r.mode === 'fixa' ? D.ymAdd(cur, 1) : cur;
      const have = new Set(db.tx.filter(t => t.recId === r.id).map(t => t.recYm)); const skip = new Set(r.skip || []);
      let ym = r.start, guard = 0;
      while (ym <= limit && guard++ < 60) {
        if (!have.has(ym) && !skip.has(ym) && findAcc(db, r.acc)) {
          Ops.addTx(db, { type: r.type, amount: r.amount, date: D.withDay(ym, r.day), desc: r.desc, cat: r.cat, acc: r.acc, status: r.mode === 'auto' ? 'pago' : 'pendente', source: 'recorrente', recId: r.id, recYm: ym }); created++;
        }
        ym = D.ymAdd(ym, 1);
      }
    }
    return created;
  }
};

const GENERIC_ACC = new Set(['cartao', 'credito', 'conta', 'carteira', 'banco', 'principal', 'debito']);

function hasKw(t, k) {
  if (!k) return false;
  if (k.length <= 4 || /^\d/.test(k)) return new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(t);
  return t.includes(k);
}
function detectCategory(db, type, t) {
  let best = null, score = 0; t = norm(t);
  for (const c of db.categories) {
    if (c.type !== type) continue;
    const kws = (c.kw || []).map(norm); if (!c.generic) kws.push(norm(c.name));
    for (const k of kws) if (k && hasKw(t, k) && k.length > score) { best = c; score = k.length; }
  }
  return best;
}
function defaultAcc(db) { return db.accounts.find(a => a.type === 'conta') || db.accounts.find(a => !isCard(a)) || db.accounts[0]; }
function detectAccount(db, n) {
  let best = null, score = 0;
  for (const a of db.accounts) {
    const full = norm(a.name);
    if (full.length >= 3 && n.includes(full) && full.length > score) { best = a; score = full.length; }
    for (const tk of full.split(/\s+/)) if (tk.length >= 4 && !GENERIC_ACC.has(tk) && hasKw(n, tk) && tk.length > score) { best = a; score = tk.length; }
  }
  if (best) return best;
  if (/\b(cartao|credito)\b/.test(n)) return db.accounts.find(isCard) || { missingCard: true };
  if (/\b(carteira|dinheiro|especie)\b/.test(n)) return db.accounts.find(a => a.type === 'carteira') || null;
  if (/\b(conta|pix|debito|banco)\b/.test(n)) return db.accounts.find(a => a.type === 'conta') || null;
  return null;
}

const AMOUNT_SRC = '(r\\$\\s*)?\\b(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)(?!\\s*%)(?:\\s*(mil|k)\\b)?(\\s*(?:reais|real|conto|contos|pila|pilas)\\b)?';
function extractAmounts(t) {
  const res = [], re = new RegExp(AMOUNT_SRC, 'g'); let m;
  while ((m = re.exec(t))) {
    const num = parseNumber(m[2]); if (!isFinite(num)) continue;
    const c = toCents(num * (m[3] ? 1000 : 1)); if (c <= 0 || c > MAX_CENTS) continue;
    res.push({ cents: c, cur: !!(m[1] || m[4]), raw: m[0] });
  }
  return res;
}
const pickAmount = a => !a.length ? null : (a.find(x => x.cur) || a[0]);

function extractInstallments(t) {
  let m;
  if ((m = t.match(/\bem\s+(\d{1,2})\s*(?:x|vezes|parcelas)\b/)) || (m = t.match(/\b(\d{1,2})\s*x\b/)) || (m = t.match(/\b(\d{1,2})\s*(?:vezes|parcelas)\b/)))
    return { n: +m[1], text: t.replace(m[0], ' ') };
  return { n: null, text: t };
}
function extractDate(t, today) {
  let m;
  if ((m = t.match(/\banteontem\b/))) return { date: D.addDays(today, -2), text: t.replace(m[0], ' ') };
  if ((m = t.match(/\bontem\b/))) return { date: D.addDays(today, -1), text: t.replace(m[0], ' ') };
  if ((m = t.match(/\bhoje\b/))) return { date: today, text: t.replace(m[0], ' ') };
  if ((m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
    let y = m[3] ? +m[3] : +today.slice(0, 4); if (y < 100) y += 2000;
    const iso = y + '-' + pad(+m[2]) + '-' + pad(+m[1]);
    if (D.valid(iso)) return { date: iso, text: t.replace(m[0], ' ') };
  }
  if ((m = t.match(/\bdia\s+(\d{1,2})\b/)) && +m[1] >= 1 && +m[1] <= 31) return { dom: +m[1], text: t.replace(m[0], ' ') };
  return { text: t };
}
function dateFromDom(dom, today, future) {
  const cur = today.slice(0, 7); let d = D.withDay(cur, dom);
  if (future) { if (d < today) d = D.withDay(D.ymAdd(cur, 1), dom); }
  else if (d > today) d = D.withDay(D.ymAdd(cur, -1), dom);
  return d;
}
function describe(original, catName) {
  const toks = original.split(/\s+/).map(w => w.replace(/^[^\p{L}\p{N}$]+|[^\p{L}\p{N}]+$/gu, '')).filter(Boolean)
    .filter(w => !/\d/.test(w) && !/^r\$/i.test(w) && !STOP.has(norm(w)) && !['mil', 'k'].includes(norm(w)));
  const d = toks.join(' ').trim();
  return d ? cap(d.toLowerCase()) : (catName || '');
}

function parsePeriod(n, today) {
  const cur = today.slice(0, 7); let m;
  if (/\bhoje\b/.test(n)) return { from: today, to: today, label: 'hoje' };
  if (/\bontem\b/.test(n)) { const d = D.addDays(today, -1); return { from: d, to: d, label: 'ontem' }; }
  if (/\bsemana passada\b/.test(n)) { const mo = D.addDays(D.monday(today), -7); return { from: mo, to: D.addDays(mo, 6), label: 'na semana passada' }; }
  if (/\b(essa|esta|nesta|nessa|na) semana\b/.test(n)) return { from: D.monday(today), to: today, label: 'nesta semana' };
  if (/\b(mes passado|mes anterior|ultimo mes)\b/.test(n)) { const ym = D.ymAdd(cur, -1), r = D.monthRange(ym); return { from: r[0], to: r[1], label: 'em ' + D.monthName(ym), ym }; }
  if ((m = n.match(/\bultimos? (\d{1,3}) dias\b/))) return { from: D.addDays(today, -(+m[1] - 1)), to: today, label: 'nos últimos ' + m[1] + ' dias' };
  if ((m = n.match(/\bultimos? (\d{1,2}) meses\b/))) return { from: D.ymAdd(cur, -(+m[1] - 1)) + '-01', to: today, label: 'nos últimos ' + m[1] + ' meses' };
  if (/\b(este|esse|neste|nesse|no) ano\b/.test(n)) return { from: today.slice(0, 4) + '-01-01', to: today, label: 'neste ano' };
  const mi = MONTHS_N.findIndex(mn => new RegExp('\\b' + mn + '\\b').test(n));
  if (mi >= 0) {
    let y = +today.slice(0, 4); if (mi + 1 > +today.slice(5, 7)) y--;
    const ym = y + '-' + pad(mi + 1), r = D.monthRange(ym); return { from: r[0], to: r[1], label: 'em ' + MONTHS[mi], ym };
  }
  const r = D.monthRange(cur); return { from: r[0], to: r[1], label: 'neste mês', ym: cur, current: true };
}

function completeDraft(db, d, today) {

  }
  if (!d.amount) { db.chat.pending = { kind: 'amount', draft: d }; return [reply('Qual foi o valor? (ex.: 50 ou 1.200,50)', ['Cancelar'])]; }
  if (!d.cat) {
    const c = detectCategory(db, d.type, norm(d.desc || ''));
    if (c) d.cat = c.id;
    else { db.chat.pending = { kind: 'cat', draft: d }; return [reply('Em qual categoria coloco ' + (d.desc ? '“' + d.desc + '”' : 'esse lançamento') + '?', topCatChips(db, d.type).concat(['Cancelar']))]; }
  }
  db.chat.pending = null;
  const acc = findAcc(db, d.acc) || defaultAcc(db); const cat = findCat(db, d.cat);
  const date = d.date || today; const dateTxt = date === today ? 'hoje' : date === D.addDays(today, -1) ? 'ontem' : 'em ' + D.brFull(date);
  let ids = [];
  if (d.installments && d.type === 'despesa') {
    const list = Ops.addInstallments(db, { total: d.amount, date, desc: d.desc, cat: d.cat, acc: acc.id, source: 'chat' }, d.installments);
    ids = list.map(t => t.id); db.chat.last = { ids };
    return [reply('Pronto ✓ Compra parcelada registrada: **' + M(d.amount) + '** em ' + d.installments + 'x de ' + M(list[1] ? list[1].amount : list[0].amount) + ' (' + cat.name + ', ' + acc.name + '). A primeira parcela cai ' + dateTxt + '.', ['Desfazer', 'Quanto tenho disponível?'])];
  }
  const t = Ops.addTx(db, { type: d.type, amount: d.amount, date, desc: d.desc, cat: d.cat, acc: acc.id, source: 'chat' });
  ids = [t.id]; db.chat.last = { ids };
  const kind = d.type === 'despesa' ? 'Despesa' : 'Receita';
  let txt = pick(['Anotado ✓ ', 'Pronto ✓ ', 'Registrado ✓ ']) + kind + ' de **' + M(d.amount) + '** em ' + cat.name + (d.desc && norm(d.desc) !== norm(cat.name) ? ' (' + d.desc.toLowerCase() + ')' : '') + ', ' + dateTxt + ', ' + (isCard(acc) ? 'no ' : 'em ') + acc.name + '.';
  if (d.type === 'despesa' && db.budgets[d.cat]) {
    const bs = F.budgetStatus(db, date.slice(0, 7)).find(x => x.id === d.cat);
    if (bs && bs.state === 'over') txt += '\n⚠ Você passou do orçamento de ' + cat.name + ' (' + M(bs.spent) + ' de ' + M(bs.limit) + ').';

/* --- parsing de lançamento --- */
function parseTx(db, text, today) {
  let n = norm(text);
  const inst = extractInstallments(n); n = inst.text;
  const dt = extractDate(n, today); n = dt.text;
  const amounts = extractAmounts(n), am = pickAmount(amounts);
  const incomeV = /\b(receb\w*|ganhei|entrou|caiu|me pagaram|vendi|rendeu|depositaram)\b/.test(n);
  const expV = /\b(gast\w*|pagu\w*|compr\w*|despesa|saiu|debit\w*|torrei|abasteci|almocei|jantei|lanchei|assinei|parcelei)\b/.test(n);
  let type = incomeV ? 'receita' : expV ? 'despesa' : (/\b(salario|receita)\b/.test(n) ? 'receita' : null);
  const acc = detectAccount(db, n);
  const noNum = n.replace(/[\d.,]+/g, ' ');
  const cat = type ? detectCategory(db, type, noNum) : null;
  const catName = cat ? cat.name : '';
  const d = { type, amount: am ? am.cents : null, desc: describe(text, ''), cat: cat ? cat.id : null, acc: acc && !acc.missingCard ? acc.id : null, installments: inst.n, missingCard: !!(acc && acc.missingCard) };
  if (dt.date) d.date = dt.date; else if (dt.dom) d.date = dateFromDom(dt.dom, today, false);
  if (!d.desc && catName) d.desc = catName;
  return { d, count: amounts.length };
}

    let type = /^(desp|gast|saida|despesa)/.test(n) ? 'despesa' : /^(rece|entrada|ganh)/.test(n) ? 'receita' : null;
    if (!type) return null; clear(); st.draft.type = type; st.draft.cat = null; return completeDraft(db, st.draft, today);

const K_PROF = 'sol:v1:profiles', K_DATA = 'sol:v1:data:';
let storageOk = true, mem = {};
try { localStorage.setItem('sol:t', '1'); localStorage.removeItem('sol:t'); } catch (e) { storageOk = false; }
/* Para trocar por Firebase (plano Spark): implementar esta mesma interface com Auth + Firestore
   (ver README e firestore.rules). O restante do app não muda. */
const Adapter = {
  name: storageOk ? 'localStorage (este aparelho)' : 'memória (temporário!)',
  read(k) { return storageOk ? localStorage.getItem(k) : (mem[k] || null); },
  write(k, v) { if (storageOk) localStorage.setItem(k, v); else mem[k] = v; },
  remove(k) { if (storageOk) localStorage.removeItem(k); else delete mem[k]; },
  profiles() { try { const p = JSON.parse(this.read(K_PROF) || '[]'); return Array.isArray(p) ? p : []; } catch (e) { return []; } },
  setProfiles(l) { this.write(K_PROF, JSON.stringify(l)); },
  blob(id) { return this.read(K_DATA + id); }, setBlob(id, s) { this.write(K_DATA + id, s); }, dropBlob(id) { this.remove(K_DATA + id); }
};
const cryptoOK = !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Vault = {
  async key(pass, salt) {
    const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async enc(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
    return { v: 1, iv: b64(iv), ct: b64(ct) };
  },
  async dec(key, blob) { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.ct)); return JSON.parse(td.decode(pt)); }
};

function filteredTx() {

  return S.db.tx.filter(t => t.date >= from && t.date <= to && (f.type === 'todos' || t.type === f.type) && (!f.cat || t.cat === f.cat) && (!f.acc || t.acc === f.acc || t.toAcc === f.acc) &&
    (!q || norm(t.desc).includes(q) || norm((catOf(t.cat) || {}).name || '').includes(q))).sort((a, b) => b.date.localeCompare(a.date) || (b.id < a.id ? 1 : -1));
}

const Forms = {

      if (id) return void Ops.updateTx(db, id, base);

    }, id ? 'Lançamento atualizado' : 'Lançamento salvo')) closeSheet();
  },
  acc(form, fd) {
    const type = fd.get('type'), card = type === 'cartao', op = parseSigned(fd.get('opening')), lim = parseSigned(fd.get('limit'));

  goal(form, fd) {

  },
  contrib(form, fd) {

  },
  bud(form, fd) { const raw = String(fd.get('limit') || '').trim(), v = raw ? Money.parse(raw) : 0; if (raw && !v) return toast('Valor inválido.', true); if (mutate(() => Ops.setBudget(S.db, form.dataset.id, v), 'Orçamento salvo')) closeSheet(); },

  cat(form, fd) { if (mutate(() => Ops.saveCategory(S.db, { id: form.dataset.id || undefined, name: fd.get('name'), type: fd.get('type'), icon: fd.get('icon'), kw: fd.get('kw') }), 'Categoria salva')) closeSheet(); },

  return db;
}

const Auth = {

/* ---------- Importar extrato (OFX / CSV) ---------- */
const Imp = {
  st: null,
  reset() { Imp.st = null; },
  accounts() { return S.db.accounts; },
  recompute() {
    const s = Imp.st; if (!s || !s.parsed) return; let rows;
    if (s.parsed.format === 'ofx') rows = s.parsed.rows;
    else { const m = Importer.mapCsv(s.parsed.csv, s.map); rows = m.rows; s.skipped = m.skipped; }
    s.rows = rows; s.items = Importer.plan(S.db, rows, s.acc, { flip: s.flip }); s.limit = 150;
  },
  load(text, name) {
    const p = Importer.parse(text); if (!p.ok) return toast(p.error, true);
    const acc = Imp.st && Imp.st.acc || (S.db.accounts.find(a => a.type !== 'cartao') || S.db.accounts[0]).id;
    Imp.st = { name, parsed: p, acc, map: p.csv ? Object.assign({}, p.csv.guess) : null, flip: false, skipped: 0, items: [], rows: [], limit: 150 };
    if (p.format === 'csv' && p.needsMap) { render(); return toast('Escolha as colunas do arquivo.'); }
    Imp.recompute(); const a = accOf(acc); Imp.st.flip = Importer.suggestFlip(Imp.st.rows, a); if (Imp.st.flip) Imp.recompute();
    if (!Imp.st.items.length) { Imp.st = null; return toast('Nenhum lançamento encontrado no arquivo.', true); }
    render();
  },
  rowHtml(it) {
    const cats = S.db.categories.filter(c => c.type === it.type);
    return '<div class="irow' + (it.include ? '' : ' off') + '"><label class="ick"><input type="checkbox" data-impi="' + it.i + '"' + (it.include ? ' checked' : '') + ' aria-label="Importar"></label><div class="imeta"><b>' + esc(it.desc) + '</b><small>' + esc(D.fmt ? D.fmt(it.date) : it.date.split('-').reverse().join('/')) + (it.dup ? ' <span class="tag">duplicado?</span>' : '') + '</small><select data-impc="' + it.i + '" aria-label="Categoria">' + opts(cats.map(c => [c.id, c.name]), it.cat, 'Sem categoria') + '</select></div><span class="num ' + (it.type === 'receita' ? 'pos' : 'neg') + '">' + (it.type === 'receita' ? '+' : '−') + M(it.amount) + '</span></div>';
  },
  listHtml() { const s = Imp.st; return s.items.slice(0, s.limit).map(Imp.rowHtml).join('') + (s.items.length > s.limit ? '<button class="btn sec block" data-act="imp-more">Mostrar mais (' + (s.items.length - s.limit) + ')</button>' : ''); },
  summary() {
    const s = Imp.st, inc = s.items.filter(x => x.include), dups = s.items.filter(x => x.dup).length;
    const sum = (t) => inc.filter(x => x.type === t).reduce((a, x) => a + x.amount, 0);
    return '<div class="kv"><span>Selecionados</span><b>' + inc.length + ' de ' + s.items.length + '</b></div><div class="kv"><span>Receitas</span><b class="pos num">+' + M(sum('receita')) + '</b></div><div class="kv"><span>Despesas</span><b class="neg num">−' + M(sum('despesa')) + '</b></div>' + (dups ? '<small class="mute">' + dups + ' possível(is) duplicado(s) vieram desmarcados.</small>' : '');
  },
  refresh() { const s = Imp.st; if (!s) return; const a = $('#impsum'), b = $('#imponbtn'); if (a) a.innerHTML = Imp.summary(); if (b) { const n = s.items.filter(x => x.include).length; b.disabled = !n; b.textContent = 'Importar ' + n + ' lançamento' + (n === 1 ? '' : 's'); } },
};
function pageImport() {
  const s = Imp.st;
  if (!s) return backBtn() + '<div class="top"><h1>Importar extrato</h1></div><div class="card stack"><p style="color:var(--ink2)">Envie o extrato do seu banco em <b>OFX</b> ou <b>CSV</b>. O arquivo é lido aqui no aparelho e não vai para nenhum servidor.</p><label class="btn block" style="cursor:pointer">' + ico('upload', 17) + 'Escolher arquivo<input type="file" id="stmtfile" accept=".ofx,.qfx,.csv,.txt,text/csv,text/plain,application/x-ofx" class="hide"></label><p class="note">Dica: no app ou site do banco procure “Exportar extrato” → OFX (melhor, evita duplicados) ou CSV. Faturas de cartão também funcionam: escolha o cartão como destino.</p></div>';
  let h = backBtn() + '<div class="top"><h1>Importar extrato</h1></div><div class="card stack"><small class="mute">' + esc(s.name) + ' · ' + s.parsed.format.toUpperCase() + '</small>' + fld('Importar para a conta', '<select data-imp="acc">' + accOpts(s.acc) + '</select>');
  if (s.parsed.format === 'csv') {
    const hd = s.parsed.csv.headers, co = (k, blank) => '<select data-impm="' + k + '">' + opts(hd.map((x, i) => [String(i), x || 'Coluna ' + (i + 1)]), s.map[k] >= 0 ? String(s.map[k]) : '', blank) + '</select>';
    h += '<details' + (s.parsed.needsMap ? ' open' : '') + '><summary class="link">Colunas do arquivo</summary><div class="stack" style="margin-top:10px">' + fld('Data', co('date', 'Escolha…')) + fld('Descrição', co('desc', '—')) + fld('Valor (positivo e negativo)', co('amount', '—')) + fld('Débito (se separado)', co('debit', '—')) + fld('Crédito (se separado)', co('credit', '—')) + '</div></details>';
  }
  if (!s.items.length) return h + '</div>';
  h += '<label class="chk"><input type="checkbox" data-imp="flip"' + (s.flip ? ' checked' : '') + '> Valores positivos são despesas <small class="mute">(comum em faturas de cartão)</small></label>' + (s.skipped ? '<small class="mute">' + s.skipped + ' linha(s) ignorada(s) (sem data/valor ou saldo).</small>' : '') + '</div>';
  h += '<div class="card stack" id="impsum">' + Imp.summary() + '</div><div class="card" id="implist">' + Imp.listHtml() + '</div>';
  const n = s.items.filter(x => x.include).length;
  return h + '<div class="actions"><button class="btn sec" data-act="imp-cancel">Cancelar</button><button class="btn" id="imponbtn" data-act="imp-go"' + (n ? '' : ' disabled') + '>Importar ' + n + ' lançamento' + (n === 1 ? '' : 's') + '</button></div>';
}

document.addEventListener('change', e => {
  const t = e.target, s = Imp.st;
  if (t.id === 'stmtfile' && t.files[0]) {

  else if (t.dataset.imp === 'flip') { s.flip = t.checked; Imp.recompute(); render(); }

/* ---------- Nuvem: Firebase (plano Spark) via REST, com dados criptografados no aparelho ----------
   O Firebase só recebe texto cifrado (AES-GCM). A senha de criptografia nunca sai do aparelho.
   Para um app com projeto Firebase fixo (SaaS), preencha FB_DEFAULT; senão o usuário cola na tela. */
const FB_DEFAULT = { apiKey: '', projectId: '' };
const K_FB = 'sol:v1:fbcfg';
const RULES = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{uid}/vault/{doc} {\n      allow read, write: if request.auth != null && request.auth.uid == uid\n        && (request.method == 'delete' || request.resource.data.ct.size() < 950000);\n    }\n  }\n}";
const AUTH_ERR = { EMAIL_EXISTS: 'Este e-mail já tem conta. Use “Entrar”.', INVALID_LOGIN_CREDENTIALS: 'E-mail ou senha da conta incorretos.', INVALID_PASSWORD: 'E-mail ou senha da conta incorretos.', EMAIL_NOT_FOUND: 'E-mail ou senha da conta incorretos.', WEAK_PASSWORD: 'Senha da conta fraca (mínimo 6 caracteres).', INVALID_EMAIL: 'E-mail inválido.', MISSING_PASSWORD: 'Informe a senha da conta.', TOO_MANY_ATTEMPTS_TRY_LATER: 'Muitas tentativas. Aguarde alguns minutos.', OPERATION_NOT_ALLOWED: 'No Firebase, ative “E-mail/senha” em Authentication.', USER_DISABLED: 'Esta conta foi desativada.', TOKEN_EXPIRED: 'Sessão expirada. Entre novamente.', INVALID_REFRESH_TOKEN: 'Sessão expirada. Entre novamente.', CREDENTIAL_TOO_OLD_LOGIN_AGAIN: 'Sessão expirada. Entre novamente.' };
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + ':' + s.length; };
const cloudDb = d => { d = d || S.db; const o = Object.assign({}, d); o.chat = { messages: [], pending: null, last: null }; o.settings = Object.assign({}, d.settings); delete o.settings.cloud; return o; };
const isConflict = e => e.status === 409 || e.code === 'FAILED_PRECONDITION' || e.code === 'ABORTED';

const Cloud = {
  sess: null, status: 'off', err: '', busy: false, timer: null,
  cfg() {
    if (FB_DEFAULT.apiKey && FB_DEFAULT.projectId) return FB_DEFAULT;
    try { const c = JSON.parse(Adapter.read(K_FB) || 'null'); return c && c.apiKey && c.projectId ? c : null; } catch (e) { return null; }
  },
  fixedCfg() { return !!(FB_DEFAULT.apiKey && FB_DEFAULT.projectId); },
  setCfg(projectId, apiKey) {
    projectId = String(projectId || '').trim().toLowerCase(); apiKey = String(apiKey || '').trim();
    if (!/^[a-z0-9][a-z0-9-]{3,38}[a-z0-9]$/.test(projectId)) throw new Error('ID do projeto inválido (ex.: meu-projeto-1234).');
    if (!/^[\w-]{20,80}$/.test(apiKey)) throw new Error('Chave de API inválida (começa com “AIza”).');
    Adapter.write(K_FB, JSON.stringify({ projectId, apiKey }));
  },
  conf() { return S.db && S.db.settings && S.db.settings.cloud; },
  label() { const c = this.conf(); if (!this.cfg()) return 'Não configurada'; if (!c) return 'Desativada — dados só neste aparelho'; return ({ ok: 'Sincronizado', sync: 'Sincronizando…', offline: 'Sem conexão', conflict: 'Conflito de versões', error: 'Erro de sincronização', off: 'Ativa' })[this.status] || 'Ativa'; },
  set(st, err) { this.status = st; this.err = err || ''; if (S.db && (S.page === 'cloud' || S.page === 'more')) { S.keepScroll = true; render(); } },
  async jf(url, opt) {
    opt = opt || {}; const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000); let r;
    try { r = await fetch(url, Object.assign({}, opt, { signal: ctl.signal })); } catch (e) { clearTimeout(t); const er = new Error('Sem conexão com a internet.'); er.offline = true; throw er; }
    clearTimeout(t); let j = null; try { j = await r.json(); } catch (e) { }
    if (!r.ok) {
      const raw = (j && j.error && (j.error.message || '')) || '', st = j && j.error && j.error.status, key = raw.split(/[\s:]/)[0];
      const er = new Error(AUTH_ERR[key] || (/API key not valid|API_KEY_INVALID/i.test(raw) ? 'Chave de API inválida.' : r.status === 403 ? 'Sem permissão. Confira as regras do Firestore e se o Firestore foi criado.' : r.status === 404 ? 'Não encontrado.' : 'Erro ' + r.status + (raw ? ': ' + raw.slice(0, 80) : '')));
      er.status = r.status; er.code = st || key; throw er;
    }
    return j;
  },
  auth(kind, body) {
    const ep = { signup: 'accounts:signUp', login: 'accounts:signInWithPassword', reset: 'accounts:sendOobCode' }[kind];
    return this.jf('https://identitytoolkit.googleapis.com/v1/' + ep + '?key=' + encodeURIComponent(this.cfg().apiKey), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  },
  setSess(r, email) {
    const prev = this.sess || {}, c = this.conf();
    this.sess = { uid: r.localId || r.user_id || prev.uid, email: r.email || email || prev.email || (c && c.email) || '', idToken: r.idToken || r.id_token, refresh: r.refreshToken || r.refresh_token || prev.refresh, exp: Date.now() + (+(r.expiresIn || r.expires_in || 3600)) * 1000 };
    if (c) c.refresh = this.sess.refresh; return this.sess;
  },
  async token() {
    if (this.sess && Date.now() < this.sess.exp - 60000) return this.sess.idToken;
    const c = this.conf(), rt = (this.sess && this.sess.refresh) || (c && c.refresh); if (!rt) throw new Error('Sessão expirada. Entre novamente.');
    const r = await this.jf('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(this.cfg().apiKey), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt) });
    this.setSess(r); return this.sess.idToken;
  },
  url() { return 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(this.cfg().projectId) + '/databases/(default)/documents/users/' + encodeURIComponent(this.sess.uid) + '/vault/main'; },
  parse(j) { const f = j.fields || {}, sv = k => f[k] && f[k].stringValue; return { salt: sv('salt'), iv: sv('iv'), ct: sv('ct'), name: sv('name') || '', rev: +((f.rev && f.rev.integerValue) || 0), updateTime: j.updateTime }; },
  async get() { const t = await this.token(); try { return this.parse(await this.jf(this.url(), { headers: { Authorization: 'Bearer ' + t } })); } catch (e) { if (e.status === 404) return null; throw e; } },
  async put(p, pre) {
    if (p.ct.length > 950000) throw new Error('Seus dados já são grandes demais para sincronizar (cerca de 4 mil lançamentos). Faça um backup e arquive o que for antigo.');
    const t = await this.token(); const qs = pre && pre.updateTime ? '?currentDocument.updateTime=' + encodeURIComponent(pre.updateTime) : '?currentDocument.exists=false';
    const body = { fields: { salt: { stringValue: p.salt }, iv: { stringValue: p.iv }, ct: { stringValue: p.ct }, name: { stringValue: p.name }, rev: { integerValue: String(p.rev) } } };
    const j = await this.jf(this.url() + qs, { method: 'PATCH', headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); return j.updateTime;
  },
  async del() { const t = await this.token(); try { await this.jf(this.url(), { method: 'DELETE', headers: { Authorization: 'Bearer ' + t } }); } catch (e) { if (e.status !== 404) throw e; } },
  async push(c, rev, pre) {
    const cur = hashStr(JSON.stringify(cloudDb())), prof = Adapter.profiles().find(x => x.id === S.pid), enc = await Vault.enc(S.key, cloudDb());
    const ut = await this.put({ salt: prof.salt, iv: enc.iv, ct: enc.ct, name: S.name, rev: rev + 1 }, pre);
    c.baseRev = rev + 1; c.updateTime = ut; c.hash = cur; c.last = Date.now(); await flush();
  },
  async pull(remote, c) {
    let db; try { db = await Vault.dec(S.key, remote); } catch (e) { throw new Error('Não consegui abrir a cópia da nuvem com a senha deste perfil. A senha de criptografia precisa ser a mesma em todos os aparelhos.'); }
    db.chat = S.db.chat; db.settings = Object.assign({}, db.settings, { cloud: c }); S.db = normDb(db);
    c.baseRev = remote.rev; c.updateTime = remote.updateTime; c.hash = hashStr(JSON.stringify(cloudDb())); c.last = Date.now(); await flush(); render();
  },
  async sync(depth) {
    const c = this.conf(); if (!c || !S.key || !this.cfg()) return;
    if (this.busy) return; this.busy = true; this.set('sync'); let again = false;
    try {
      const remote = await this.get(), cur = hashStr(JSON.stringify(cloudDb())), changed = cur !== c.hash;
      if (!remote) await this.push(c, 0, null);
      else if (remote.rev === c.baseRev && remote.updateTime === c.updateTime) { if (changed) await this.push(c, remote.rev, { updateTime: remote.updateTime }); }
      else if (!changed) { await this.pull(remote, c); toast('Dados atualizados da nuvem'); }
      else { this.set('conflict'); this.busy = false; return this.conflictSheet(remote, c); }
      this.set('ok');
    } catch (e) { if (e.offline) this.set('offline'); else if (isConflict(e) && !depth) again = true; else this.set('error', e.message); }
    finally { this.busy = false; }
    if (again) return this.sync(1);
  },
  conflictSheet(remote, c) {
    const bg = sheet('Conflito de versões', '<p style="color:var(--ink2);margin-bottom:14px">Este aparelho e a nuvem têm alterações diferentes. Qual versão você quer manter? A outra será substituída.</p><div class="stack"><button class="btn block" id="cf1">Manter este aparelho</button><button class="btn sec block" id="cf2">Usar a versão da nuvem</button><button class="btn sec block" data-act="close-sheet">Decidir depois</button></div><p class="note">Dica: exporte um backup em Mais › Backup antes de decidir.</p>');
    const run = fn => async () => { closeSheet(); this.busy = true; this.set('sync'); try { await fn(); this.set('ok'); } catch (e) { this.set('error', e.message); } this.busy = false; };
    $('#cf1', bg).onclick = run(() => this.push(c, remote.rev, { updateTime: remote.updateTime })); $('#cf2', bg).onclick = run(async () => { await this.pull(remote, c); toast('Dados da nuvem carregados'); });
  }
};
let cloudTimer = null;
function cloudSchedule() { clearTimeout(cloudTimer); if (!S.db || !S.db.settings || !S.db.settings.cloud) return; cloudTimer = setTimeout(() => Cloud.sync(), 4000); }

async function cloudEnable(mode, email, pw) {
  if (!S.enc || !S.key) throw new Error('A nuvem exige criptografia ativa. Abra o app pelo endereço https.');
  const r = await Cloud.auth(mode, { email, password: pw, returnSecureToken: true }); Cloud.setSess(r, email);
  const c = { uid: Cloud.sess.uid, email, refresh: Cloud.sess.refresh, baseRev: 0, updateTime: null, hash: '', last: null };
  const remote = await Cloud.get();
  if (!remote) { S.db.settings.cloud = c; await Cloud.push(c, 0, null); Cloud.set('ok'); toast('Nuvem ativada'); return; }
  const bg = sheet('Já existe uma cópia', '<p style="color:var(--ink2);margin-bottom:14px">Esta conta já tem dados na nuvem. O que fazer?</p><div class="stack"><button class="btn sec block" id="ce1">Baixar da nuvem (substitui este aparelho)</button><button class="btn block" id="ce2">Substituir a nuvem pelos dados deste aparelho</button></div>');
  const run = fn => async () => { closeSheet(); S.db.settings.cloud = c; Cloud.set('sync'); try { await fn(); Cloud.set('ok'); toast('Nuvem ativada'); } catch (e) { delete S.db.settings.cloud; Cloud.set('error', e.message); toast(e.message, true); } };
  $('#ce1', bg).onclick = run(() => Cloud.pull(remote, c)); $('#ce2', bg).onclick = run(() => Cloud.push(c, remote.rev, { updateTime: remote.updateTime }));
  bg.addEventListener('click', e => { if (e.target === bg) { Cloud.sess = null; } });
}

Auth.join = async fd => {
  const err = m => renderAuth('join', m), email = String(fd.get('email') || '').trim(), pw = String(fd.get('pw') || ''), vpw = String(fd.get('vpw') || '');
  try {
    if (!cryptoOK) return err('Abra o app pelo endereço https para usar a nuvem.');
    if (!Cloud.cfg()) Cloud.setCfg(fd.get('projectId'), fd.get('apiKey'));
    if (!email || !pw || !vpw) return err('Preencha todos os campos.');
    const btn = $('button[type=submit]'); if (btn) { btn.disabled = true; btn.textContent = 'Baixando…'; }
    Cloud.sess = null; Cloud.setSess(await Cloud.auth('login', { email, password: pw, returnSecureToken: true }), email);
    const remote = await Cloud.get(); if (!remote) return err('Esta conta ainda não tem dados na nuvem. Ative a sincronização no outro aparelho primeiro.');
    const key = await Vault.key(vpw, unb64(remote.salt)); let db; try { db = await Vault.dec(key, remote); } catch (e) { return err('Senha de criptografia incorreta.'); }
    const p = { id: 'u' + E.uid(), name: remote.name || 'Meu perfil', enc: true, salt: remote.salt, created: D.today() };
    db = normDb(db); db.settings.cloud = { uid: Cloud.sess.uid, email, refresh: Cloud.sess.refresh, baseRev: remote.rev, updateTime: remote.updateTime, hash: '', last: Date.now() };
    db.settings.cloud.hash = hashStr(JSON.stringify(cloudDb(db)));
    Adapter.setBlob(p.id, JSON.stringify(await Vault.enc(key, db))); const list = Adapter.profiles(); list.push(p); Adapter.setProfiles(list);
    await openProfile(p, key, db, true); toast('Dados carregados da nuvem');
  } catch (e) { err(e.message || 'Não foi possível entrar.'); }
};

Forms.join = fd => Auth.join(fd);

function pageCloud() {
  const cfg = Cloud.cfg(), c = Cloud.conf(); let h = backBtn() + '<div class="top"><h1>Sincronização</h1></div>';
  if (!S.enc) return h + '<div class="banner">A nuvem exige criptografia ativa. Abra o Sol pelo endereço https no Safari.</div>';
  if (!cfg) {
    h += '<div class="card"><h2>1. Crie seu projeto Firebase (grátis)</h2><ol class="steps"><li>Acesse <b>console.firebase.google.com</b> e crie um projeto (plano <b>Spark</b>, sem cartão).</li><li><b>Authentication</b> › Começar › ative <b>E-mail/senha</b>.</li><li><b>Firestore Database</b> › Criar banco › aba <b>Regras</b> › cole as regras abaixo › Publicar.</li><li>Engrenagem › <b>Configurações do projeto</b> › Seus apps › ícone <b>&lt;/&gt;</b> (Web) › registre e copie <b>apiKey</b> e <b>projectId</b>.</li></ol><button class="btn sec block" data-act="copy-rules">Copiar regras do Firestore</button></div>' +
      '<div class="card"><h2>2. Cole os dados do projeto</h2><form data-form="cloudcfg" autocomplete="off">' + fld('ID do projeto (projectId)', '<input type="text" name="projectId" autocapitalize="none" autocorrect="off" placeholder="meu-projeto-1234">') + fld('Chave de API (apiKey)', '<input type="text" name="apiKey" autocapitalize="none" autocorrect="off" placeholder="AIza...">', 'Não é um segredo: a proteção está nas regras e na criptografia.') + '<button class="btn block" type="submit">Salvar</button></form></div>';
    return h;
  }
  if (!c) {
    h += '<div class="card"><h2>Ativar a nuvem</h2><p class="note" style="margin:-4px 0 12px">Crie uma <b>conta da nuvem</b> (e-mail + senha). Seus dados sobem criptografados com a <b>senha do Sol</b>, que nunca sai do aparelho — nem o Google consegue ler.</p><form data-form="cloudacct" autocomplete="off">' + fld('E-mail', '<input type="text" name="email" inputmode="email" autocapitalize="none" autocomplete="email">') + fld('Senha da conta da nuvem', '<input type="password" name="pw" autocomplete="new-password" placeholder="Mínimo 6 caracteres">', 'Diferente da senha do Sol. Serve só para entrar na conta.') + '<div class="actions"><button class="btn sec" name="intent" value="login" type="submit">Entrar</button><button class="btn" name="intent" value="signup" type="submit">Criar conta</button></div><button class="link" style="margin-top:14px" name="intent" value="reset" type="submit">Esqueci a senha da conta</button></form></div>';
    return h + (Cloud.fixedCfg() ? '' : '<button class="link" data-act="cloud-cfg-clear">Trocar projeto Firebase</button>');
  }
  const st = Cloud.status === 'off' ? 'ok' : Cloud.status;
  h += '<div class="card"><div class="kv"><span>Estado</span><span class="stat ' + st + '"><i></i>' + esc(Cloud.label()) + '</span></div><div class="kv"><span>Conta</span><b>' + esc(c.email) + '</b></div><div class="kv"><span>Última sincronização</span><b>' + (c.last ? esc(new Date(c.last).toLocaleString('pt-BR')) : '—') + '</b></div><div class="kv"><span>Versão na nuvem</span><b>' + (c.baseRev || 0) + '</b></div></div>';
  if (Cloud.err) h += '<div class="banner">' + esc(Cloud.err) + '</div>';
  h += '<div class="card stack"><button class="btn block" data-act="cloud-sync">Sincronizar agora</button><button class="btn sec block" data-act="cloud-reset">Redefinir senha da conta (e-mail)</button><button class="btn sec block" data-act="cloud-off">Desativar neste aparelho</button><button class="btn danger block" data-act="cloud-wipe">Apagar a cópia na nuvem</button></div>' +
    '<p class="note">Sincroniza ao abrir, a cada alteração e ao sair do app. O conteúdo do chat não é enviado. Se dois aparelhos mudarem o mesmo dado sem sincronizar, o Sol pergunta qual versão manter. Troque a senha do Sol só com a nuvem desativada.</p>';
  return h;
}
PAGES.cloud = pageCloud; SUB.cloud = 'Sincronização';

Forms.cloudcfg = (form, fd) => { try { Cloud.setCfg(fd.get('projectId'), fd.get('apiKey')); render(); toast('Projeto salvo'); } catch (e) { toast(e.message, true); } };
Forms.cloudacct = async (form, fd) => {
  const intent = fd.get('intent'), email = String(fd.get('email') || '').trim(), pw = String(fd.get('pw') || '');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('E-mail inválido.', true);
  const btns = $$('button', form); btns.forEach(b => b.disabled = true);
  try {
    if (intent === 'reset') { await Cloud.auth('reset', { requestType: 'PASSWORD_RESET', email }); toast('Se a conta existir, enviamos um e-mail (veja o spam).'); }
    else { if (pw.length < 6) throw new Error('A senha da conta precisa ter 6+ caracteres.'); await cloudEnable(intent === 'signup' ? 'signup' : 'login', email, pw); }
  } catch (e) { toast(e.message, true); }
  btns.forEach(b => b.disabled = false); render();
};
Object.assign(Act, {
  'copy-rules'() { try { navigator.clipboard.writeText(RULES).then(() => toast('Regras copiadas'), () => toast('Não consegui copiar.', true)); } catch (e) { toast('Não consegui copiar.', true); } },
  'cloud-cfg-clear'() { Adapter.remove(K_FB); render(); },
  async 'cloud-sync'() { await Cloud.sync(); toast(Cloud.status === 'ok' ? 'Sincronizado' : Cloud.label(), Cloud.status === 'error'); },
  'cloud-off'() { confirmSheet('Desativar a nuvem neste aparelho? A cópia na nuvem continua guardada.', 'Desativar', () => { delete S.db.settings.cloud; Cloud.sess = null; Cloud.status = 'off'; save(); render(); toast('Nuvem desativada'); }); },
  'cloud-wipe'() { confirmSheet('Apagar a cópia na nuvem e desativar? Seus dados continuam neste aparelho.', 'Apagar cópia', async () => { try { await Cloud.del(); delete S.db.settings.cloud; Cloud.sess = null; Cloud.status = 'off'; save(); render(); toast('Cópia apagada'); } catch (e) { toast(e.message, true); } }); },
  async 'cloud-reset'() { try { await Cloud.auth('reset', { requestType: 'PASSWORD_RESET', email: Cloud.conf().email }); toast('E-mail de redefinição enviado (veja o spam).'); } catch (e) { toast(e.message, true); } }
});
document.addEventListener('visibilitychange', () => { if (S.db && Cloud.conf()) Cloud.sync(); });
window.addEventListener('online', () => { if (S.db && Cloud.conf()) Cloud.sync(); });

/* ---------- Boot ---------- */
renderAuth();
window.__sol = { S, Adapter, render };   // somente para depuração/testes
})();
